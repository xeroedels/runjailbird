<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Jailbirds, Run!</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0f152f;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: "Courier New", monospace;
        touch-action: manipulation;
        user-select: none;
        padding: 12px;
      }
      #gameWrap {
        position: relative;
        width: 100%;
        max-width: 600px;
      }
      canvas {
        background: #0f152f;
        border: 2px solid #ffe66d;
        display: block;
        width: 100%;
        height: auto;
        touch-action: none;
      }
      #hud {
        position: absolute;
        top: 10px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 16px;
        font-size: 16px;
        color: #ffe66d;
        font-weight: bold;
      }
      #hud span {
        pointer-events: none;
      }
      #pauseBtn {
        pointer-events: auto;
        background: none;
        border: 2px solid #ffe66d;
        color: #ffe66d;
        border-radius: 4px;
        font-size: 14px;
        padding: 2px 10px;
        cursor: pointer;
        font-family: inherit;
      }
      #pauseBtn:hover {
        background: #ffe66d;
        color: #0f152f;
      }
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(15, 21, 47, 0.9);
        text-align: center;
        color: #ffe66d;
      }
      #overlay h1 {
        font-size: 28px;
        margin-bottom: 10px;
      }
      #overlay p {
        font-size: 14px;
        margin-bottom: 16px;
      }
      #overlay button {
        padding: 10px 24px;
        font-size: 16px;
        font-family: inherit;
        font-weight: bold;
        background: #ffe66d;
        color: #0f152f;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      #overlay button:hover {
        background: #fff3b0;
      }
      .hidden {
        display: none !important;
      }
      #instructions {
        margin-top: 10px;
        font-size: 12px;
        color: #8a8fa8;
      }
    </style>
  </head>
  <body>
    <div id="gameWrap">
      <canvas id="game" width="600" height="200"></canvas>
      <div id="hud">
        <span id="score">Score: 0</span>
        <button id="pauseBtn">⏸</button>
        <span id="lives">❤️❤️❤️❤️❤️❤️</span>
      </div>
      <div id="overlay">
        <h1 id="overlayTitle">Run, Jailbird, Run</h1>
        <p id="overlayText">Press SPACE, click, or tap to jump</p>
        <button id="startBtn">Start</button>
      </div>
    </div>
    <div id="instructions">
      Space / Click / Tap = Jump (double jump are enabled)
    </div>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const W = canvas.width,
        H = canvas.height;
      const groundY = H - 30;

      const scoreEl = document.getElementById("score");
      const livesEl = document.getElementById("lives");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");

      let state = "ready"; // ready | playing | paused | gameover <- status from the game
      let previousState = null;
      let score = 0;
      let lives = 6;
      let speed = 6;
      let frame = 0;
      let obstacles = [];
      let invincibleTimer = 0;
      let bgOffset1 = 0;
      let framesSinceSpawn = 0;
      let highestScore =
        Number(localStorage.getItem("jailbirdHighestScore")) || 0;

      let rollingNovelites = [];
      const NOVELITES_SIZE = 22;

      const skyEvents = [
        { threshold: 1000, type: "eyes1", triggered: false },
        { threshold: 2000, type: "eyes2", triggered: false }
      ];
      let activeSkyEvent = null;
      const SKY_EVENT_DURATION = 240;

      // Background layers
      const bgSky = new Image();
      bgSky.src = "images/bgsky.png";
      let bgSkyLoaded = false;
      bgSky.onload = () => {
        bgSkyLoaded = true;
      };

      // Nerissa's eyes sprite for sky event
      const eyes1Sprite = new Image();
      eyes1Sprite.src = "images/nerissaseyes.png";
      let eyes1Loaded = false;
      eyes1Sprite.onload = () => {
        eyes1Loaded = true;
      };
      const EYES1_FRAME_COUNT = 15;
      const EYES1_FRAME_W = 300;
      const EYES1_FRAME_H = 200;
      const EYES1_ANIM_SPEED = 4;

      // Second eyes but with a different sprite
      const eyes2Sprite = new Image();
      eyes2Sprite.src = "images/eyes2.png";
      let eyes2Loaded = false;
      eyes2Sprite.onload = () => {
        eyes2Loaded = true;
      };

      // Jailbird variable
      const player = {
        x: 50,
        y: groundY - 40,
        w: 40,
        h: 40,
        vy: 0,
        jumping: false,
        gravity: 0.9,
        jumpForce: -14,
        jumpsUsed: 0,
        maxJumps: 2
      };

      // Rosarians const
      const chaser = {
        offsetX: 90,
        w: 60,
        h: 50,
        bobPhase: 0
      };

      const chaserSprite = new Image();
      chaserSprite.src = "images/rosarianchasing.png";
      let chaserSpriteLoaded = false;
      chaserSprite.onload = () => {
        chaserSpriteLoaded = true;
      };
      const CHASER_FRAME_COUNT = 10;
      const CHASER_FRAME_W = 66;
      const CHASER_FRAME_H = 46;
      let chaserAnimFrame = 0;
      let chaserAnimTimer = 0;

      // Jailbirds sprite
      const spriteSheet = new Image();
      spriteSheet.src = "images/jailbirdjumping.png";
      const FRAME_COUNT = 5;
      const FRAME_SIZE = 50;
      let spriteLoaded = false;
      spriteSheet.onload = () => {
        spriteLoaded = true;
      };
      let animFrame = 0;
      let animTimer = 0;

      // Background music
      const bgMusic = new Audio("audio/bgmusic.mp3");
      bgMusic.loop = true;
      bgMusic.volume = 0.5;

      function resetGame() {
        score = 0;
        lives = 6;
        speed = 6;
        frame = 0;
        obstacles = [];
        invincibleTimer = 0;
        bgOffset1 = 0;
        framesSinceSpawn = 0;
        rollingNovelites = [];
        activeSkyEvent = null;
        skyEvents.forEach((e) => (e.triggered = false));
        chaser.bobPhase = 0;
        player.y = groundY - player.h;
        player.vy = 0;
        player.jumping = false;
        player.jumpsUsed = 0;
        updateHUD();
      }

      function updateHUD() {
        scoreEl.textContent = "Score: " + Math.floor(score);
        livesEl.textContent =
          "❤️".repeat(Math.max(lives, 0)) + "🖤".repeat(6 - Math.max(lives, 0));
      }

      function jump() {
        if (state === "ready") {
          startGame();
          return;
        }
        if (state === "gameover") {
          startGame();
          return;
        }
        if (state === "paused") return;

        if (player.jumpsUsed < player.maxJumps) {
          player.vy = player.jumpForce;
          player.jumping = true;
          player.jumpsUsed++;
        }
      }

      function togglePause() {
        if (state === "playing") {
          state = "paused";
          pauseBtn.textContent = "▶";
          overlayTitle.textContent = "PAUSED";
          overlayText.textContent = "Tap resume to keep going";
          startBtn.textContent = "Resume";
          overlay.classList.remove("hidden");
          bgMusic.pause();
        } else if (state === "paused") {
          state = "playing";
          pauseBtn.textContent = "⏸";
          overlay.classList.add("hidden");
          bgMusic.play().catch(() => {});
        }
      }

      function startGame() {
        resetGame();
        state = "playing";
        overlay.classList.add("hidden");
        bgMusic.currentTime = 0;
        bgMusic.play().catch(() => {});
      }

      function spawnNovelites() {
        rollingNovelites.push({
          x: W + 20,
          y: groundY - NOVELITES_SIZE,
          rotation: 0
        });
      }

      function spawnObstacle() {
        const isDouble = Math.random() < 0.25;
        const h = 20 + Math.random() * 30;
        const w = 18 + Math.random() * 10;

        obstacles.push({ x: W + 10, y: groundY - h, w, h, passed: false });

        if (isDouble) {
          const gap = 55 + Math.random() * 15;
          const h2 = 20 + Math.random() * 30;
          const w2 = 18 + Math.random() * 10;
          obstacles.push({
            x: W + 10 + w + gap,
            y: groundY - h2,
            w: w2,
            h: h2,
            passed: false
          });
        }
      }

      function endGame() {
        state = "gameover";
        overlayTitle.textContent = "GAME OVER";

        const finalScore = Math.floor(score);
        if (finalScore > highestScore) {
          highestScore = finalScore;
          localStorage.setItem("jailbirdHighestScore", highestScore);
        }
        overlayText.textContent =
          "Your score: " + finalScore + " · Best: " + highestScore;
        startBtn.textContent = "Play Again";
        overlay.classList.remove("hidden");
        bgMusic.pause();
      }

      function rectsCollide(a, b) {
        return (
          a.x < b.x + b.w &&
          a.x + a.w > b.x &&
          a.y < b.y + b.h &&
          a.y + a.h > b.y
        );
      }

      function update() {
        frame++;
        score += 0.15;
        speed = 6 + Math.floor(score / 100) * 0.5;

        // player physics
        player.vy += player.gravity;
        player.y += player.vy;
        if (player.y >= groundY - player.h) {
          player.y = groundY - player.h;
          player.vy = 0;
          player.jumping = false;
          player.jumpsUsed = 0;
        }
        framesSinceSpawn++;
        const spawnInterval = Math.max(65, 105 - Math.floor(score / 20));
        if (framesSinceSpawn >= spawnInterval) {
          spawnObstacle();
          framesSinceSpawn = 0;
        }

        // THORN
        const hitbox = {
          x: player.x + 8,
          y: player.y + 8,
          w: player.w - 16,
          h: player.h - 12
        };
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const o = obstacles[i];
          o.x -= speed;

          if (invincibleTimer <= 0 && rectsCollide(hitbox, o)) {
            lives--;
            invincibleTimer = 60;
            updateHUD();
            if (lives <= 0) {
              endGame();
              return;
            }
          }

          if (o.x + o.w < 0) obstacles.splice(i, 1);
        }

        if (invincibleTimer > 0) invincibleTimer--;

        chaser.bobPhase += 0.15;
        chaserAnimTimer++;
        if (chaserAnimTimer >= 5) {
          chaserAnimTimer = 0;
          chaserAnimFrame = (chaserAnimFrame + 1) % CHASER_FRAME_COUNT;
        }

        if (score >= 300 && Math.random() < 0.004) {
          spawnNovelites();
        }

        const NoveliteHitbox = {
          x: player.x + 8,
          y: player.y + 8,
          w: player.w - 16,
          h: player.h - 12
        };
        for (let i = rollingNovelites.length - 1; i >= 0; i--) {
          const n = rollingNovelites[i];
          n.x -= speed * 1.6;
          n.rotation += 0.3;

          const bBox = {
            x: n.x - NOVELITES_SIZE / 2,
            y: n.y - NOVELITES_SIZE / 2,
            w: NOVELITES_SIZE,
            h: NOVELITES_SIZE
          };
          if (invincibleTimer <= 0 && rectsCollide(NoveliteHitbox, bBox)) {
            lives--;
            invincibleTimer = 60;
            updateHUD();
            if (lives <= 0) {
              endGame();
              return;
            }
          }
          if (n.x + NOVELITES_SIZE < 0) rollingNovelites.splice(i, 1);
        }

        for (const ev of skyEvents) {
          if (!ev.triggered && score >= ev.threshold) {
            ev.triggered = true;
            activeSkyEvent = {
              type: ev.type,
              framesLeft: SKY_EVENT_DURATION,
              elapsed: 0
            };
          }
        }
        if (activeSkyEvent) {
          activeSkyEvent.framesLeft--;
          activeSkyEvent.elapsed++;
          if (activeSkyEvent.framesLeft <= 0) activeSkyEvent = null;
        }

        animTimer++;
        const animSpeed = player.jumping ? 4 : 6;
        if (animTimer >= animSpeed) {
          animTimer = 0;
          animFrame = (animFrame + 1) % FRAME_COUNT;
        }

        updateHUD();
      }

      function drawClouds(offset) {
        if (!bgSkyLoaded) return;
        ctx.drawImage(bgSky, 0, 0, W, H);
      }

      function drawSkyEvent() {
        if (!activeSkyEvent) return;

        const fadeFrames = 20;
        let alpha = 1;
        if (activeSkyEvent.elapsed < fadeFrames) {
          alpha = activeSkyEvent.elapsed / fadeFrames;
        }
        ctx.save();
        ctx.globalAlpha = alpha;

        if (activeSkyEvent.type === "eyes1") {
          if (eyes1Loaded) {
            const rawIndex = Math.floor(
              activeSkyEvent.elapsed / EYES1_ANIM_SPEED
            );
            const frameIndex = Math.min(rawIndex, EYES1_FRAME_COUNT - 1);
            ctx.drawImage(
              eyes1Sprite,
              frameIndex * EYES1_FRAME_W,
              0,
              EYES1_FRAME_W,
              EYES1_FRAME_H,
              0,
              0,
              W,
              H
            );
          } else {
            const blink = Math.sin(frame * 0.1) > -0.85;
            const positions = [
              { x: 90, y: 35 },
              { x: 220, y: 25 }
            ];
            positions.forEach((p) => {
              ctx.fillStyle = "#ffe66d";
              if (blink) {
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, 10, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#0f152f";
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
              } else {
                ctx.fillRect(p.x - 10, p.y - 1, 20, 2);
              }
            });
          }
        } else if (activeSkyEvent.type === "eyes2") {
          if (eyes2Loaded) {
            ctx.drawImage(eyes2Sprite, 0, 0, W, H);
          } else {
            const blink = Math.sin(frame * 0.15) > -0.85;
            const positions = [
              { x: 60, y: 20 },
              { x: 150, y: 40 },
              { x: 250, y: 20 },
              { x: 320, y: 35 }
            ];
            positions.forEach((p) => {
              ctx.fillStyle = "#ff6b6b";
              if (blink) {
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, 11, 7, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#0f152f";
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
                ctx.fill();
              } else {
                ctx.fillRect(p.x - 11, p.y - 1, 22, 2);
              }
            });
          }
        }

        ctx.restore();
      }

      function drawChaser() {
        const bobY = Math.sin(chaser.bobPhase) * 0;
        const cx = player.x - chaser.offsetX;
        const cy = groundY - chaser.h + bobY;
        if (cx < -chaser.w) return; // off-screen, don't bother drawing

        // ROSARIAN chasing
        if (chaserSpriteLoaded) {
          ctx.drawImage(
            chaserSprite,
            chaserAnimFrame * CHASER_FRAME_W,
            0,
            CHASER_FRAME_W,
            CHASER_FRAME_H,
            cx,
            cy,
            chaser.w,
            chaser.h
          );
        }
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        drawClouds(bgOffset1);
        drawSkyEvent();
        drawChaser();

        if (invincibleTimer <= 0 || frame % 6 < 3) {
          if (spriteLoaded) {
            ctx.drawImage(
              spriteSheet,
              animFrame * FRAME_SIZE,
              0,
              FRAME_SIZE,
              FRAME_SIZE,
              player.x,
              player.y,
              player.w,
              player.h
            );
          } else {
            // fallback while sprite is loading
            ctx.fillStyle = "#535353";
            ctx.fillRect(player.x, player.y, player.w, player.h);
          }
        }

        // NOVELITES
        rollingNovelites.forEach((b) => {
          ctx.save();
          ctx.translate(b.x + NOVELITES_SIZE / 2, b.y + NOVELITES_SIZE / 2);
          ctx.rotate(b.rotation);
          ctx.fillStyle = "#a855f7";
          ctx.beginPath();
          ctx.arc(0, 0, NOVELITES_SIZE / 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(NOVELITES_SIZE / 2, 0);
          ctx.stroke();
          ctx.restore();
        });
        // obstacles
        ctx.fillStyle = "#ff6b6b";
        obstacles.forEach((o) => {
          ctx.fillRect(o.x, o.y, o.w, o.h);
        });
      }

      function loop() {
        if (state === "playing") {
          update();
          draw();
        }
        requestAnimationFrame(loop);
      }

      // input
      document.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          jump();
        }
      });
      canvas.addEventListener(
        "pointerdown",
        (e) => {
          e.preventDefault();
          jump();
        },
        { passive: false }
      );
      startBtn.addEventListener("click", () => {
        if (state === "paused") {
          togglePause();
        } else {
          startGame();
        }
      });
      pauseBtn.addEventListener("click", togglePause);

      draw();
      loop();
    </script>
  </body>
</html>
