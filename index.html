<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Runner Game</title>
    <!-- UI language: English -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0f152f;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: "Courier New", monospace;
        touch-action: manipulation;
        user-select: none;
        padding: 12px;
      }
      #gameWrap {
        position: relative;
        width: 100%;
        max-width: 600px;
      }
      canvas {
        background: #0f152f;
        border: 2px solid #ffe66d;
        display: block;
        width: 100%;
        height: auto;
        touch-action: none;
      }
      #hud {
        position: absolute;
        top: 10px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 16px;
        font-size: 16px;
        color: #ffe66d;
        font-weight: bold;
      }
      #hud span {
        pointer-events: none;
      }
      #pauseBtn {
        pointer-events: auto;
        background: none;
        border: 2px solid #ffe66d;
        color: #ffe66d;
        border-radius: 4px;
        font-size: 14px;
        padding: 2px 10px;
        cursor: pointer;
        font-family: inherit;
      }
      #pauseBtn:hover {
        background: #ffe66d;
        color: #0f152f;
      }
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(15, 21, 47, 0.9);
        text-align: center;
        color: #ffe66d;
      }
      #overlay h1 {
        font-size: 28px;
        margin-bottom: 10px;
      }
      #overlay p {
        font-size: 14px;
        margin-bottom: 16px;
      }
      #overlay button {
        padding: 10px 24px;
        font-size: 16px;
        font-family: inherit;
        font-weight: bold;
        background: #ffe66d;
        color: #0f152f;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      #overlay button:hover {
        background: #fff3b0;
      }
      .hidden {
        display: none !important;
      }
      #instructions {
        margin-top: 10px;
        font-size: 12px;
        color: #8a8fa8;
      }
    </style>
  </head>
  <body>
    <div id="gameWrap">
      <canvas id="game" width="600" height="200"></canvas>
      <div id="hud">
        <span id="score">Score: 0</span>
        <button id="pauseBtn">⏸</button>
        <span id="lives">❤️❤️❤️</span>
      </div>
      <div id="overlay">
        <h1 id="overlayTitle">Run, Jailbird, Run</h1>
        <p id="overlayText">Press SPACE, click, or tap to jump</p>
        <button id="startBtn">Start</button>
      </div>
    </div>
    <div id="instructions">Space / Click / Tap = Jump</div>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const W = canvas.width,
        H = canvas.height;
      const groundY = H - 30;

      const scoreEl = document.getElementById("score");
      const livesEl = document.getElementById("lives");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");

      let state = "ready"; // ready | playing | paused | gameover
      let previousState = null;
      let score = 0;
      let lives = 3;
      let speed = 6;
      let frame = 0;
      let obstacles = [];
      let invincibleTimer = 0;
      let bgOffset1 = 0; // sky/moon layer (static)

      // Background layers
      const bgSky = new Image();
      bgSky.src =
        "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAADICAYAAABS39xVAAALQ0lEQVR4AezZvZIjSRUG0KY9cBaMDXwcTDwcnp+HwOEFCCCIILCI2O3cWfXWaCRVZVb+3Mo8G1Pb3VJV5r3nlj5pet7//8Ovf+h9/PNf//3hu+//5GDgHnAPZN0D728D/vvud9+//f1vfx2wsy0JELiywJDAujKY2gkQGCcwLLB8yuo/dDsSuLrAsMCKDuevrNEnNG997r3nsx0aWJE/Zf3hj395rnbymSvdkD1r7bnXyRE2/R1sy3vvTN8R5jM0sM7gXe3a7bCj3pCPTHvW2nOvR73mPLatdTvbnDWanttg8W3PDZY/tKTAOsR0/qSew17lBfRqKj0Nes72Vc8rPCewJpyyF9DbG4M+N3bPN4bUUZPA+s+//5HWPnSc/T1Wb7BDTVU4ada+KtA0X2JW+xZ9PXtjaLFXGnyTwEohlBbvcTwDe7R3QkzHo+e+eizADzl9BSh3qhKuYp/u5XQcxe/ZV85eOT00CayjgL3PS4jp6L1vz/1yht+zrhF7zW6R7uV0jLCtuWdOD0sFVk3kqGvlDD9qD7XqYlFLMs46XQMr53dbEYiivENHqSPCTOrX8GXFKMZR6viisv//3vV2Dayev9vap94/I+cduuXgcup41FWr2krWLbnmUU/3j51d96zxfT3bn3Nqa1nHtqZa3+fWm2PxqMaugfWogFkeyx1cz75b1Vaybsk1R6xarXtk771zIte2V3vt57cWKbzSkbOHwMrRanxu7vAal2P5DwEz+UBo9CeFVzpylj8ZWDlbOXdPIHd4e+t5/ryAmZw3rLnC8MBKv4h/dlN4d6s5amsR2BeI/pobHlivCJ8F2atrPEeAQLlA9Ndc6MAqZ293ZfR3oHadv1m6soB7KR9UYGWaRX8HymzH6QMFZruXegTw0MB69furgfeRrX8W6HED/rzV55cRe35u7ptTAj0CeGhgndLJvDjCCyFCDTlsPW7A+3pG7HlfQ87PEWbaooYcg5rn7vUyLLB6f7qK8ELoUcPewGveXNHX6mHRY6Z7zhFq2Kvx6PN7vQwLrKMNOC9PYG/geatd+2wW157fo+qHBNb201Xpu2DpdY8QPEZgJYHS107pdTVtuwfWNqxujZRARH73vPXlK4GIAiWvnZLXaIveuwbWo7BKeOlo0Zw1CRCoI5Beo+mos1r5Kt0C61FYlZftSgIEVhToElizhFWUj8X3N2q0ulI96bivc+TPzeo52VTUuk629c3ltfpsHlizhFWaQISPxKmO+yNaXamedNzXOfLnaPXcLKLWdauv1tdafTYNrJnCqtbgrEOAQLlAk8BKQZWOWqla3l7MK2t9PI7Z3RpVmeGYOVcNrBRS6UhBlY7dlhY9gc31B2+GY2ZYJbBSSKUjDTEdY1r5dlfvgt+aeGRugdnv+fcUNLkjTNdsjxRS6bhfZzTeo5rua/QzgZkERt/zrV/z76nBbfgc+T5dsz2eDTyd8+w5j88l8OpG/fLcXP3q5rFA6Ws+3SPpeLzqL4/+9FfCtEnO8cvlviPwRSDdP1+++/b/r5779myPrCiQ7pF07PX+U2DtneR5AgQIRBAQWBGmoAYCcwk060ZgNaO1MAECtQWqBdaRX5jVLt56BAjEF6iZDdUC68gvzOLTqpAAgdoCNbOhWmDVbnLh9bROgMATAYH1BMbDBAjEExBY8WaiIgIEnggIrCcwHibQQ8AeeQICK8+r2tk1/+WkWlEWOiRgdoeYmpwksJqw7i9a819O9ndzRk0Bs6upmbeWwMrzcjYBAgMFLh1YA91sTYDAAAGBNQDdlgQIlAkIrDI3VxEgMEBAYA1At2WBgEsIfAgIrA8EfwgQuIaAwLrGnFRJgMCHgMD6QPCHAIFIAs9rEVjPbTxDgEAwAYEVbCDKIUDguYDAem7jGQIEggkIrGADOV+OFQjMKyCw5p2tz       let bgSkyLoaded = false;
      bgSky.onload = () => {
        bgSkyLoaded = true;
      };

      const player = {
        x: 50,
        y: groundY - 40,
        w: 40,
        h: 40,
        vy: 0,
        jumping: false,
        gravity: 0.9,
        jumpForce: -14
      };

      // The thing chasing Jailbird — stays a fixed distance behind, bobs up and down
      const chaser = {
        offsetX: 55, // how far behind the player it stays
        w: 36,
        h: 36,
        bobPhase: 0
      };

      // Sprite animation setup
      const spriteSheet = new Image();
      spriteSheet.src =
        "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAAyCAYAAAB1V8bkAAAEL0lEQVR4nO2csVUjMRCGh3vXApE3oQciGqADIiqgBApwCa6AiA5ogMjBxRccCRe5CF/gJ7ws0mokjXbF6fve83t+tjXSv/JoNdqRLo5HAYD/nB9rNwAA6oOjA3QAjg7QATg6QAfg6AAdgKMDdACODtABODpAB+DoAB2AowN0AI4O0AE/127A2gzD5iPb//3970WrNteoEx1t1Vlis1tHdxft8vpBREQO+52pfWd3GHZHkXp/MHTo6F1Hl1P32p0xtnnumI35PkF06OldR5eOLnK+UA7LEX5qa1qXJeiIg46CqXtrMQgAhEl29FZjEAAIk+ToS8Ugl9cPcnn9IIf9ToZhc1zC2X31aOOf3HI1QAc6fCTf0WvHIGMxztlrMx5UQt/7cG3zlasZB4ZABzpCXKScGTcMm+O4osN+Zz61rl3H1P4UN6PIIVbWUgs64qDjTDeOPg071sKN1rma0GFLLzqKH6/5phfDsDlqXhpblqzdGVZtQIcdvegoyoxrKQax4uXpUUREbu+3i5SrBTrQMUY9dW89Bpkj1naHu6gO7cXNKZejCR3oiBHSEb2ja2OQkjuxxjbP1QHyUcXoa0+nW2kDwHfFLNf95enxy1SjZrlUlnger6WkLeiwpwcds1P3nBjk5ekxKwbRlHNT+NTp+zQRJ4fcOGuuTTll0HECHeE2+T7vaj/6dIvfWvVb2UGHTf1WdlrW0c021dQRO2VkTR2FSxYU0WH725y2lJRdS8fs4zXtivtSjw8ssphKRl2LZ5oWmX7oOIGOMzEds1P37xSDxFhzB9OUkh156LCnBx2qGP07xCAaQu1/e30WEZGrm7vZ8tpBas6exY48dJxAx+c2ZK+6i6Tf1VNjkJRHa7WSZdyFe3t9jnZKDAsbuaDjK+g4oV6Mm7ub395vP16+73zvNWU1decQGlyubu7k7fX5Y+RMwZULdUaNXAF0hEHHZ6KO3loMYmVrrlNyWfJPFbONDnSMKUqB1Y5SsTu2xl6N9YHQhfr951eyrVCZJbL+0KEv06uOooSZlmIQDb5dcrW2M4Y6wmJhER3p9K4jKWGm5RgkhlvIO+x33otvOdL7bN3eb4vzAMZl0aEHHRl39FBOunP2HNaIpZyGab59CaGOqAk6wqDjTPTgiXHWz7jC0OiVc4JGbCR031ueHxeaao3rS2XOxhLn68XaoAUdebSsQ+XoIqfFsNjIYuHoNadZjumR0jUZx041/ljuPTp09KpDdZSU1tlLHX0JJx8zfVxn1TnThZHap+KgYx50ZDi6IxR35B5+N2enhqP7NPlWLmOdFCtTa5ByoOMz6PBTdK67SDsxSAqaU2tdvbEkHfebWMe632Y1OAA6/G1Dx1eSHd29by0GsWB68bX15parBTrQMSXJ0UMNaCEGAYAwyY7eagwCAGGyp+5jWohBACDMP2KL6mf1vJbqAAAAAElFTkSuQmCC";
      const FRAME_COUNT = 5;
      const FRAME_SIZE = 50;
      let spriteLoaded = false;
      spriteSheet.onload = () => {
        spriteLoaded = true;
      };
      let animFrame = 0;
      let animTimer = 0;

      function resetGame() {
        score = 0;
        lives = 3;
        speed = 6;
        frame = 0;
        obstacles = [];
        invincibleTimer = 0;
        bgOffset1 = 0;
        chaser.bobPhase = 0;
        player.y = groundY - player.h;
        player.vy = 0;
        player.jumping = false;
        updateHUD();
      }

      function updateHUD() {
        scoreEl.textContent = "Score: " + Math.floor(score);
        livesEl.textContent =
          "❤️".repeat(Math.max(lives, 0)) + "🖤".repeat(3 - Math.max(lives, 0));
      }

      function jump() {
        if (state === "ready") {
          startGame();
          return;
        }
        if (state === "gameover") {
          startGame();
          return;
        }
        if (state === "paused") return;
        if (!player.jumping) {
          player.vy = player.jumpForce;
          player.jumping = true;
        }
      }

      function togglePause() {
        if (state === "playing") {
          state = "paused";
          pauseBtn.textContent = "▶";
          overlayTitle.textContent = "PAUSED";
          overlayText.textContent = "Tap resume to keep going";
          startBtn.textContent = "Resume";
          overlay.classList.remove("hidden");
        } else if (state === "paused") {
          state = "playing";
          pauseBtn.textContent = "⏸";
          overlay.classList.add("hidden");
        }
      }

      function startGame() {
        resetGame();
        state = "playing";
        overlay.classList.add("hidden");
      }

      function spawnObstacle() {
        const h = 20 + Math.random() * 30;
        obstacles.push({
          x: W + 10,
          y: groundY - h,
          w: 18 + Math.random() * 10,
          h: h,
          passed: false
        });
      }

      function endGame() {
        state = "gameover";
        overlayTitle.textContent = "GAME OVER";
        overlayText.textContent = "Your score: " + Math.floor(score);
        startBtn.textContent = "Play Again";
        overlay.classList.remove("hidden");
      }

      function rectsCollide(a, b) {
        return (
          a.x < b.x + b.w &&
          a.x + a.w > b.x &&
          a.y < b.y + b.h &&
          a.y + a.h > b.y
        );
      }

      function update() {
        frame++;
        score += 0.15;
        speed = 6 + Math.floor(score / 100) * 0.5;

        // parallax background offsets (background moves slower than obstacles)
        // bgOffset1 (sky/moon layer) stays static — drawn once, no scroll

        // player physics
        player.vy += player.gravity;
        player.y += player.vy;
        if (player.y >= groundY - player.h) {
          player.y = groundY - player.h;
          player.vy = 0;
          player.jumping = false;
        }

        // spawn obstacles
        if (frame % Math.max(50, 90 - Math.floor(score / 20)) === 0) {
          spawnObstacle();
        }

        // move obstacles + collision
        const hitbox = {
          x: player.x + 8,
          y: player.y + 8,
          w: player.w - 16,
          h: player.h - 12
        };
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const o = obstacles[i];
          o.x -= speed;

          if (invincibleTimer <= 0 && rectsCollide(hitbox, o)) {
            lives--;
            invincibleTimer = 60;
            updateHUD();
            if (lives <= 0) {
              endGame();
              return;
            }
          }

          if (o.x + o.w < 0) obstacles.splice(i, 1);
        }

        if (invincibleTimer > 0) invincibleTimer--;

        chaser.bobPhase += 0.15;

        // advance sprite animation (faster while airborne to sell the jump)
        animTimer++;
        const animSpeed = player.jumping ? 4 : 6;
        if (animTimer >= animSpeed) {
          animTimer = 0;
          animFrame = (animFrame + 1) % FRAME_COUNT;
        }

        updateHUD();
      }

      function drawClouds(offset) {
        if (!bgSkyLoaded) return;
        // static background — stretch once to fill the whole canvas, no tiling
        ctx.drawImage(bgSky, 0, 0, W, H);
      }

      function drawChaser() {
        const bobY = Math.sin(chaser.bobPhase) * 5;
        const cx = player.x - chaser.offsetX;
        const cy = groundY - chaser.h + bobY;
        if (cx < -chaser.w) return; // off-screen, don't bother drawing

        // placeholder shape until a real sprite is supplied — dark, spiky, menacing
        ctx.fillStyle = "#7a1f3d";
        ctx.beginPath();
        ctx.ellipse(
          cx + chaser.w / 2,
          cy + chaser.h / 2,
          chaser.w / 2,
          chaser.h / 2,
          0,
          0,
          Math.PI * 2
        );
        ctx.fill();
        // simple glowing eyes
        ctx.fillStyle = "#ffe66d";
        ctx.beginPath();
        ctx.arc(cx + chaser.w * 0.35, cy + chaser.h * 0.4, 3, 0, Math.PI * 2);
        ctx.arc(cx + chaser.w * 0.65, cy + chaser.h * 0.4, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        drawClouds(bgOffset1);
        drawChaser();

        // player (blink if invincible)
        if (invincibleTimer <= 0 || frame % 6 < 3) {
          if (spriteLoaded) {
            ctx.drawImage(
              spriteSheet,
              animFrame * FRAME_SIZE,
              0,
              FRAME_SIZE,
              FRAME_SIZE,
              player.x,
              player.y,
              player.w,
              player.h
            );
          } else {
            // fallback while sprite is loading
            ctx.fillStyle = "#535353";
            ctx.fillRect(player.x, player.y, player.w, player.h);
          }
        }

        // obstacles
        ctx.fillStyle = "#ff6b6b";
        obstacles.forEach((o) => {
          ctx.fillRect(o.x, o.y, o.w, o.h);
        });
      }

      function loop() {
        if (state === "playing") {
          update();
          draw();
        }
        requestAnimationFrame(loop);
      }

      // input
      document.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          jump();
        }
      });
      canvas.addEventListener(
        "pointerdown",
        (e) => {
          e.preventDefault();
          jump();
        },
        { passive: false }
      );
      startBtn.addEventListener("click", () => {
        if (state === "paused") {
          togglePause();
        } else {
          startGame();
        }
      });
      pauseBtn.addEventListener("click", togglePause);

      draw();
      loop();
    </script>
  </body>
</html>
